<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Rep UQ — Catálogo & Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --uq-red:#d6323b;
  --uq-red-dark:#6b1a16;
  --uq-burgundy:#241210;
  --uq-cream:#faf7f2;
  --uq-cream-dark:#f2ede4;
  --uq-ink:#201917;
  --uq-ink-soft:#68605c;
  --uq-border:#e6ded4;
  --uq-white:#ffffff;
  --uq-gold:#c99a3f;
  --uq-green:#25d366;
  --radius-lg:20px;
  --radius-md:12px;
  --shadow-sm: 0 2px 10px rgba(36,18,16,.07), 0 1px 2px rgba(36,18,16,.08);
  --shadow-md: 0 8px 24px rgba(36,18,16,.12);
  --shadow-lg: 0 14px 34px rgba(36,18,16,.20);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;color:var(--uq-ink);
  background:
    radial-gradient(900px 500px at 8% 0%, rgba(214,50,59,.07), transparent 60%),
    radial-gradient(700px 450px at 100% 15%, rgba(107,26,22,.08), transparent 55%),
    radial-gradient(600px 400px at 50% 100%, rgba(36,18,16,.05), transparent 60%),
    var(--uq-cream);
  background-attachment:fixed;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:rgba(36,18,16,.88);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  color:var(--uq-white);
  padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.1);
  box-shadow:0 4px 24px rgba(36,18,16,.18);
}
.brand-badge{display:flex;align-items:center;gap:12px;}
.brand-badge .mark{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--uq-red),var(--uq-red-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;
  box-shadow:0 4px 12px rgba(214,50,59,.3);
}
.brand-badge .title b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:#fff;}
.brand-badge .title span{font-size:11px;color:rgba(255,255,255,.65);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#dfeeeb;padding:6px 12px;border-radius:100px;font-size:13px;display:flex;align-items:center;gap:6px;}

.min-order-tracker{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:100px;padding:6px 14px;display:flex;align-items:center;gap:10px;
  color:#fff;font-size:12px;
}
.tracker-bar{width:80px;height:6px;background:rgba(255,255,255,.2);border-radius:100px;overflow:hidden;}
.tracker-fill{height:100%;background:linear-gradient(90deg,#ff8a7d,var(--uq-red));transition:width .3s ease;}

.cart-btn{
  position:relative;background:linear-gradient(135deg,var(--uq-red),var(--uq-red-dark));color:#fff;border-radius:11px;
  padding:9px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;
  transition:transform .18s ease, box-shadow .18s ease;box-shadow:0 6px 16px rgba(214,50,59,.35);
}
.cart-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(214,50,59,.45);}
.cart-badge{background:#fff;color:var(--uq-red);border-radius:100px;min-width:20px;height:20px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;}

.login-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:32px 18px;position:relative;overflow:hidden;
  background:linear-gradient(125deg,var(--uq-burgundy) 0%,var(--uq-red-dark) 45%,var(--uq-red) 75%,#ff6a5e 100%);
  background-size:200% 200%;animation:gradient-flow 14s ease infinite;
}
@keyframes gradient-flow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.login-card{
  background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(180%);
  border-radius:24px;box-shadow:0 30px 70px rgba(20,8,6,.35);
  width:100%;max-width:440px;padding:38px 34px 32px;border:1px solid rgba(255,255,255,.5);
  position:relative;overflow:hidden;z-index:1;
}
.login-badge{
  width:56px;height:56px;border-radius:16px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--uq-red),var(--uq-red-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue';font-size:24px;color:#fff;
  box-shadow:0 10px 22px rgba(214,50,59,.35);
}
.login-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--uq-red);font-weight:700;margin-bottom:6px;}
.login-title{font-size:38px;margin:0 0 4px;color:var(--uq-burgundy);}
.login-sub{color:var(--uq-ink-soft);font-size:14px;margin:0 0 26px;line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--uq-ink);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input, .field textarea{
  width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--uq-border);
  font-size:15px;background:#fbfaf8;transition:all .18s ease;
}
.field input:focus, .field textarea:focus{outline:none;border-color:var(--uq-red);background:#fff;box-shadow:0 0 0 4px rgba(214,50,59,.12);}
.field .hint{font-size:11.5px;color:var(--uq-ink-soft);margin-top:5px;}
.btn-primary{
  width:100%;background:linear-gradient(135deg,var(--uq-burgundy),var(--uq-red-dark));
  color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:6px;
  transition:transform .18s ease, box-shadow .18s ease;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 20px rgba(36,18,16,.25);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(214,50,59,.30);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.error-msg{background:#fdecec;color:var(--uq-red-dark);border:1px solid #f5c6c2;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.admin-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--uq-ink-soft);text-decoration:underline;background:none;width:100%;}
.admin-link:hover{color:var(--uq-red);}

.catalog-wrap{flex:1;padding:24px 20px 100px;max-width:1200px;margin:0 auto;width:100%;}
.wix-hero{
  position:relative;overflow:hidden;border-radius:24px;margin-bottom:28px;
  background:linear-gradient(120deg,var(--uq-burgundy) 0%,var(--uq-red-dark) 55%,var(--uq-red) 100%);
  padding:44px 34px;color:#fff;box-shadow:var(--shadow-md);
}
.wix-hero-eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;margin-bottom:10px;}
.wix-hero h1{font-size:clamp(32px,5vw,50px);margin:0 0 10px;line-height:1;}
.wix-hero p{font-size:15px;color:rgba(255,255,255,.85);max-width:520px;line-height:1.5;margin:0 0 22px;}
.wix-hero-stats{display:flex;gap:28px;flex-wrap:wrap;}
.wix-hero-stats .stat b{font-family:'Bebas Neue';font-size:28px;display:block;line-height:1;}
.wix-hero-stats .stat span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.65);}

.featured-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:28px;}
.featured-card{
  border-radius:20px;overflow:hidden;position:relative;background:var(--uq-cream-dark);
  min-height:180px;display:flex;align-items:flex-end;cursor:pointer;
  transition:transform .25s ease, box-shadow .25s ease;box-shadow:var(--shadow-sm);
}
.featured-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);}
.featured-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px;}
.featured-card .fc-overlay{position:relative;width:100%;background:linear-gradient(0deg,rgba(36,18,16,.88),transparent);padding:16px 16px 14px;color:#fff;}
.fc-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#ffd9d5;margin-bottom:3px;}
.fc-name{font-family:'Bebas Neue';font-size:22px;line-height:1;}

.search-row{display:flex;gap:12px;margin:20px 0 16px;flex-wrap:wrap;}
.search-box{flex:1;min-width:240px;position:relative;}
.search-box input{width:100%;padding:13px 15px 13px 42px;border-radius:12px;border:1.5px solid var(--uq-border);font-size:14.5px;background:#fff;}
.search-box input:focus{outline:none;border-color:var(--uq-red);}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--uq-ink-soft);font-size:16px;}
.cat-select{padding:13px 15px;border-radius:12px;border:1.5px solid var(--uq-border);background:#fff;font-size:14px;min-width:180px;color:var(--uq-ink);}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tab{
  padding:9px 18px;border-radius:100px;background:#fff;border:1px solid var(--uq-border);
  font-size:13px;font-weight:700;color:var(--uq-ink-soft);transition:all .18s ease;
}
.tab:hover{border-color:var(--uq-red);color:var(--uq-red);}
.tab.active{background:var(--uq-burgundy);border-color:var(--uq-burgundy);color:#fff;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;}
.card{
  background:#fff;border-radius:var(--radius-lg);border:1px solid var(--uq-border);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover{
  box-shadow:var(--shadow-md);transform:translateY(-5px);border-color:rgba(214,50,59,.25);
}
.card-photo{
  height:210px;background:radial-gradient(circle at 50% 30%, #fff, var(--uq-cream) 80%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:16px;
}
.card-photo img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .3s ease;filter:drop-shadow(0 8px 12px rgba(0,0,0,.08));}
.card:hover .card-photo img{transform:scale(1.06);}
.card-photo .noimg{
  width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--uq-red),var(--uq-red-dark));
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:26px;color:#fff;
}
.card-line{
  position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;letter-spacing:.05em;
  padding:4px 10px;border-radius:100px;text-transform:uppercase;
}
.card-line.OTC{background:#fff3e0;color:#a15c00;}
.card-line.Genéricos{background:#e3f0ff;color:#0a5aa8;}
.card-line.Marcas{background:#f3e8ff;color:#7b2fc4;}
.card-body{padding:18px;flex:1;display:flex;flex-direction:column;}
.card-cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--uq-red);font-weight:700;margin-bottom:4px;}
.card-name{font-size:18px;color:var(--uq-burgundy);margin:0 0 4px;font-weight:800;line-height:1.2;}
.card-active{font-size:12px;color:var(--uq-ink-soft);margin-bottom:10px;line-height:1.35;min-height:16px;}
.card-bullets{list-style:none;padding:0;margin:0 0 12px;font-size:12px;color:var(--uq-ink);}
.card-bullets li{padding-left:14px;position:relative;margin-bottom:4px;line-height:1.3;}
.card-bullets li::before{content:"•";position:absolute;left:0;color:var(--uq-red);font-weight:800;}
.card-foot{margin-top:auto;display:flex;gap:8px;}
.btn-detail{
  flex:1;background:var(--uq-cream-dark);color:var(--uq-burgundy);padding:10px;border-radius:10px;
  font-weight:700;font-size:13px;text-align:center;transition:background .15s;
}
.btn-detail:hover{background:#e2dacd;}
.btn-quick-add{
  background:var(--uq-red);color:#fff;width:40px;height:40px;border-radius:10px;
  font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.btn-quick-add:hover{background:var(--uq-red-dark);transform:scale(1.05);}
.btn-quick-add.added{background:var(--uq-burgundy);}

.selos-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.selo-chip{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;background:rgba(214,50,59,.08);color:var(--uq-red-dark);padding:3px 8px;border-radius:100px;border:1px solid rgba(214,50,59,.18);}

.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
@media(min-width:640px){.overlay{align-items:center;}}
.modal{background:#fff;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);}
@media(min-width:640px){.modal{border-radius:22px;}}
.modal-photo{height:240px;background:radial-gradient(circle at 50% 30%, #fff, var(--uq-cream) 80%);display:flex;align-items:center;justify-content:center;position:relative;padding:20px;}
.modal-photo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(36,18,16,.16));}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(10,30,28,.5);color:#fff;width:34px;height:34px;border-radius:100px;font-size:16px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:24px;}
.modal-cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--uq-red);font-weight:700;margin-bottom:4px;}
.modal-name{font-size:28px;color:var(--uq-burgundy);margin:0 0 4px;}
.modal-active{font-size:13.5px;color:var(--uq-ink-soft);margin-bottom:14px;}
.modal-bullets{list-style:none;padding:0;margin:0 0 20px;}
.modal-bullets li{padding-left:18px;position:relative;margin-bottom:6px;font-size:13.5px;line-height:1.4;}
.modal-bullets li::before{content:"✓";position:absolute;left:0;color:var(--uq-red);font-weight:800;}
.pres-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--uq-burgundy);margin-bottom:12px;}
.pres-item{border:1.5px solid var(--uq-border);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;}
.pres-name{font-weight:700;font-size:14px;color:var(--uq-ink);}
.pres-meta{font-size:11px;color:var(--uq-ink-soft);margin-top:2px;}
.pres-price{font-size:13px;color:var(--uq-ink);margin-top:4px;}
.pres-tiers{display:flex;gap:6px;margin-top:8px;}
.pres-tiers .tier{flex:1;background:var(--uq-cream-dark);border-radius:8px;padding:6px 4px;text-align:center;font-size:10.5px;color:var(--uq-ink-soft);}
.pres-tiers .tier b{display:block;font-size:12.5px;color:var(--uq-red);margin-top:2px;}
.pres-bula{display:inline-block;font-size:11.5px;margin-top:6px;color:#0a6cff;text-decoration:none;font-weight:600;}

.qty-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.qty-btn{width:32px;height:32px;border-radius:8px;background:var(--uq-cream-dark);color:var(--uq-burgundy);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;}
.qty-val{min-width:28px;text-align:center;font-weight:800;font-size:14px;}
.btn-add{background:var(--uq-red);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap;}
.btn-add.added{background:var(--uq-burgundy);}

.cart-overlay{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:200;display:flex;justify-content:flex-end;}
.cart-drawer{background:var(--uq-cream);width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
.cart-head{background:var(--uq-burgundy);color:#fff;padding:20px;display:flex;align-items:center;justify-content:space-between;}
.cart-head h2{margin:0;font-size:24px;}
.cart-close{background:rgba(255,255,255,.12);width:32px;height:32px;border-radius:100px;color:#fff;font-size:16px;}
.cart-items{flex:1;overflow-y:auto;padding:16px;}
.cart-item{background:#fff;border-radius:14px;border:1px solid var(--uq-border);padding:14px;margin-bottom:12px;}
.ci-top{display:flex;justify-content:space-between;gap:8px;}
.ci-name{font-weight:800;font-size:14px;color:var(--uq-burgundy);}
.ci-pres{font-size:11.5px;color:var(--uq-ink-soft);margin-top:2px;}
.ci-remove{color:var(--uq-red);font-size:11.5px;font-weight:700;background:none;}
.ci-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.cart-empty{text-align:center;padding:60px 20px;color:var(--uq-ink-soft);}
.cart-foot{padding:18px 20px 24px;border-top:1px solid var(--uq-border);background:#fff;}
.cart-summary{display:flex;justify-content:space-between;font-size:13.5px;color:var(--uq-ink-soft);margin-bottom:10px;}
.cart-summary b{color:var(--uq-ink);}
.cart-total-row{display:flex;justify-content:space-between;font-size:17px;color:var(--uq-ink);margin-bottom:14px;padding-top:12px;border-top:1px dashed var(--uq-border);}
.cart-total-row b{color:#0a8f4a;}
.min-order-warning{background:#fff4e0;border:1px solid #f0c46a;color:#8a5a00;font-size:12.5px;line-height:1.5;border-radius:12px;padding:12px;margin-bottom:12px;}

.client-box{background:rgba(214,50,59,.07);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;border:1px solid rgba(214,50,59,.15);}
.client-box b{color:var(--uq-burgundy);}

.steps-row{display:flex;align-items:center;gap:6px;margin-bottom:16px;}
.step-dot{flex:1;height:4px;border-radius:100px;background:var(--uq-border);}
.step-dot.done{background:var(--uq-red);}
.step-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--uq-ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.step-labels span.active{color:var(--uq-red);}

.confirm-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 18px;}
.confirm-card{background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);max-width:480px;width:100%;padding:38px 30px;text-align:center;border:1px solid var(--uq-border);}
.confirm-icon{width:68px;height:68px;border-radius:100px;background:rgba(214,50,59,.1);color:var(--uq-red);font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.confirm-card h2{font-size:32px;color:var(--uq-burgundy);margin:0 0 6px;}
.confirm-card p{color:var(--uq-ink-soft);font-size:14px;margin:0 0 22px;line-height:1.5;}
.confirm-num{font-family:'JetBrains Mono';background:var(--uq-cream-dark);padding:8px 16px;border-radius:8px;font-weight:700;display:inline-block;margin-bottom:22px;font-size:14px;}
.btn-row{display:flex;flex-direction:column;gap:10px;}
.btn-wa{background:var(--uq-green);color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-wa:hover{background:#1ebc59;}
.btn-xls{background:var(--uq-burgundy);color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-ghost{background:none;color:var(--uq-ink-soft);padding:10px;font-weight:600;font-size:13.5px;text-decoration:underline;}

.admin-wrap{flex:1;padding:24px 20px 60px;max-width:1000px;margin:0 auto;width:100%;}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.admin-head h1{font-size:30px;color:var(--uq-burgundy);margin:0;}
.admin-stats{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.stat-card{background:#fff;border:1px solid var(--uq-border);border-radius:14px;padding:16px 20px;flex:1;min-width:140px;}
.stat-card .num{font-family:'Bebas Neue';font-size:32px;color:var(--uq-burgundy);line-height:1;}
.stat-card .lbl{font-size:11.5px;color:var(--uq-ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.order-row{background:#fff;border:1px solid var(--uq-border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s;}
.order-row:hover{box-shadow:var(--shadow-sm);}
.order-row-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.order-row-top .num{font-weight:800;color:var(--uq-burgundy);font-family:'JetBrains Mono';font-size:13px;}
.order-row-top .date{font-size:12px;color:var(--uq-ink-soft);}
.order-row-client{font-size:14.5px;font-weight:700;margin-top:4px;}
.order-row-meta{font-size:12px;color:var(--uq-ink-soft);margin-top:2px;}
.order-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--uq-border);font-size:12.5px;}
.order-detail-item{display:flex;justify-content:space-between;padding:4px 0;}
.btn-export{background:var(--uq-burgundy);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:13.5px;}
.btn-back{background:none;color:var(--uq-ink-soft);font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:5px;}

.pix-price{text-align:center;font-family:'Bebas Neue';font-size:42px;color:var(--uq-red);margin:6px 0 18px;}
.pix-price span{font-family:'Plus Jakarta Sans';font-size:14px;color:var(--uq-ink-soft);font-weight:600;}
.pix-qr{display:flex;justify-content:center;margin-bottom:18px;padding:16px;background:#fff;border-radius:16px;border:1px solid var(--uq-border);}
.pix-qr img{max-width:100%;height:auto;image-rendering:pixelated;}

#toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast-modern{
  background:var(--uq-burgundy);color:#fff;padding:12px 22px;border-radius:100px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.sticky-cart-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:var(--uq-burgundy);color:#fff;padding:14px 22px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 -6px 20px rgba(36,18,16,.25);animation:barSlideUp .25s ease;
}
@keyframes barSlideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sticky-cart-bar .info{font-size:13.5px;}
.sticky-cart-bar .info b{font-size:15px;}
.sticky-cart-bar button{background:var(--uq-red);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13.5px;}

.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--uq-ink-soft);font-size:14px;padding:40px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--uq-ink-soft);}
.empty-state .big{font-size:40px;margin-bottom:8px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#cfc9ba;border-radius:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-wrap"></div>
<script src="products_data.js"></script>
<script src="app_logic.js"></script>
</body>
</html>
